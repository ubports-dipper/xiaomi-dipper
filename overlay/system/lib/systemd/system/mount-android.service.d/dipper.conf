[Service]
# Xenial mount-android.conf ran these before emitting mounted-android.
ExecStartPre=/bin/sh -c 'mkdir -p /dev/cpuset && mount none /dev/cpuset -t cpuset -o nodev,noexec,nosuid 2>/dev/null || true'
ExecStartPost=/bin/sh -c 'umount /android/cache 2>/dev/null || true; mkdir -p /userdata/cache /android/cache/recovery; mount -o bind /userdata/cache /android/cache || true'
ExecStartPost=/bin/sh -c 'if [ -d /android/metadata ]; then mount -o bind /android/metadata /var/lib/lxc/android/rootfs/metadata || true; fi'
ExecStartPost=/bin/sh -c 'if [ -d /android/vendor ] && ! mountpoint -q /vendor; then mkdir -p /vendor; mount --bind /android/vendor /vendor || true; fi'
