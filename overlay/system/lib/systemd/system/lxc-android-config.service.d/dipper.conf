# Units enabled only via the Halium overlay (multi-user/graphical .wants) are
# loaded by mount-halium-overlay's daemon-reload, after the boot transaction
# was already built, so nothing would start them. This unit is queued before
# that reload and starts right after it; re-requesting default.target builds
# a fresh transaction that picks up the overlay's Wants=.
# journald is started before the overlay is mounted, so restart it to pick up
# the overlay's journald.conf.d (stream fds survive via the fd store).
[Service]
ExecStartPost=-/bin/systemctl --no-block start default.target
ExecStartPost=-/bin/systemctl --no-block restart systemd-journald.service
# Off-mode charging boot: keep Android's "on charger" blocks from running
# (see /usr/libexec/dipper-android-charger-guard).
ExecStartPre=-/usr/libexec/dipper-android-charger-guard
