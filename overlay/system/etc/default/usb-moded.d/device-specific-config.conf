# Dipper usb-moded settings (bind-mounted over the stock porter template).
#
# -D: debug logging, kept while USB/ADB bring-up is in progress (the cable
# decision is only visible at debug level). The real fix for "requested while
# not connected to pc" is extcon_tracking=0 in 90-device-specific-config.ini.
# ADB itself is requested via the stock /userdata/.force-adb marker
# (/usr/libexec/force-adb -> mtp_adb mode).
USB_MODED_HW_ADAPTATION_ARGS="-D"
