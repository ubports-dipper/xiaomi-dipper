# Dipper usb-moded overrides (bind-mounted over the stock porter file).
#
# The kernel's USB extcon never reports USB=1, so with extcon tracking
# usb-moded rewrites the correct charger type USB_CDP (PC port) to USB_DCP
# ("override charger_type: USB_CDP -> USB_DCP"), concludes it is on a wall
# charger and refuses every data mode, ADB included. Trust power_supply only.
[udev]
extcon_tracking = 0
